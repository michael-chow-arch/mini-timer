<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini Timer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="timer-shell" aria-label="Mini Timer">
      <div id="timer-view" class="timer-view">
        <div class="timer-readout">
          <div class="timer-caption">
            <button id="timer-mode" class="text-button" type="button" aria-label="切换为倒计时" title="切换模式并重置计时">正计时</button>
            <button id="edit-duration" class="text-button" type="button" title="设置倒计时时长" hidden>时长</button>
            <span id="timer-status" role="status" aria-live="polite"></span>
          </div>
          <output id="time-display" class="time-display" aria-live="off">00:00</output>
        </div>
        <div class="controls" aria-label="计时器控制">
          <button id="toggle-timer" class="icon-button" type="button" aria-label="开始计时" aria-pressed="false" title="开始">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4" />
              <path class="play-symbol" d="m10 8 6 4-6 4Z" fill="currentColor" />
              <path class="pause-symbol" d="M9 8h2.4v8H9zm3.6 0H15v8h-2.4z" fill="currentColor" />
            </svg>
          </button>
          <button id="reset-timer" class="icon-button" type="button" aria-label="重置计时" title="重置">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4.8 9.5A8 8 0 1 1 5 15.3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.4" />
              <path d="M4.8 4.8v4.7h4.7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" />
            </svg>
          </button>
        </div>
      </div>
      <form id="duration-form" class="duration-form" hidden novalidate>
        <label for="duration-input">时长（分钟，或分:秒）</label>
        <span id="duration-error" role="alert"></span>
        <div class="duration-controls">
          <input id="duration-input" type="text" value="5" maxlength="8" autocomplete="off" spellcheck="false" aria-describedby="duration-error" />
          <button class="text-button" type="submit">确定</button>
          <button id="cancel-duration" class="text-button" type="button">取消</button>
        </div>
      </form>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
