name: Feature request
description: Suggest a focused improvement to Mini Timer.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Mini Timer is intentionally a small, offline, forward-counting presentation timer. Please keep suggestions focused on that purpose.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the presentation or timing workflow problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior, without sharing private presentation material.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Relevant platform
      options:
        - macOS
        - Windows
        - Both
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional.
