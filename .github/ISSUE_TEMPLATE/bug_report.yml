name: Bug report
description: Report a reproducible Mini Timer problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Please remove personal data, private presentation content, tokens, and private file paths before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Mini Timer
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11 x64
        - Windows 10 x64
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: App version and environment
      description: Include Mini Timer version, OS version, display setup, and whether a presentation app was in slideshow mode.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Optional. Do not include presentation files or unredacted logs.
